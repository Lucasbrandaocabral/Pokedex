<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokédex Pocket: abra pacotes, colecione cartas Pokémon no seu álbum e troque com bots.">
    <meta name="theme-color" content="#101428">
    <title>Pokédex Pocket</title>
    <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topo">
        <a class="logo" href="#inicio"><span class="pokebola-logo"></span>Pokédex <b>Pocket</b></a>
        <div class="hud">
            <a class="hud-item" href="#loja" title="Moedas">🪙 <span id="hud-moedas">0</span></a>
            <span class="hud-item" title="Pontos de pacote">✨ <span id="hud-pontos">0</span></span>
            <a class="hud-item" href="#pacotes" title="Pacotes disponíveis">🎁 <span id="hud-pacotes">0</span>
                <small id="hud-gratis"></small></a>
            <button class="hud-item" id="btn-som" data-acao="som" title="Som">🔊</button>
        </div>
    </header>

    <main id="app"></main>

    <nav class="nav">
        <a class="nav-item" data-tela="inicio" href="#inicio"><span>🏠</span>Início<i class="badge" id="badge-inicio" hidden></i></a>
        <a class="nav-item" data-tela="pacotes" href="#pacotes"><span>✂️</span>Pacotes</a>
        <a class="nav-item" data-tela="album" href="#album"><span>📖</span>Álbum<i class="badge" id="badge-album" hidden></i></a>
        <a class="nav-item" data-tela="trocas" href="#trocas"><span>🔄</span>Trocas</a>
        <a class="nav-item" data-tela="loja" href="#loja"><span>🛒</span>Loja</a>
        <a class="nav-item" data-tela="pokedex" href="#pokedex"><span>🔎</span>Pokédex</a>
    </nav>

    <div id="abertura" class="abertura"></div>
    <div id="modal" class="modal">
        <div class="modal-caixa">
            <button class="modal-fechar" aria-label="Fechar">✕</button>
            <div id="modal-conteudo"></div>
        </div>
    </div>
    <div id="avisos" class="avisos"></div>

    <script type="module" src="Js/main.js"></script>
</body>
</html>
